name: frontend
description: "Frontend aplikasi Agronoma"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  camera: ^0.12.1
  device_info_plus: ^13.3.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  http: ^1.6.0
  image_picker: ^1.2.4
  latlong2: ^0.10.1
  lottie: ^3.6.1
  platform: ^3.2.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/lottie/

  # SF Pro (dipakai di beberapa frame Figma) tidak di-bundle karena lisensinya
  # milik Apple dan tidak boleh didistribusikan. Digantikan oleh Inter, yang
  # sudah menjadi typeface utama pada design ini sehingga tampilannya konsisten.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
